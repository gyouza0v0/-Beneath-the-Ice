<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Beneath the Ice</title>
<style>
  /* ============================================================
     自定义字体
     ============================================================ */
  @font-face {
    font-family: 'MyFont';
    src: url('fonts/myfont.subset.woff2') format('woff2');
    font-display: swap;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* 防保存基础防护 */
  img {
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
    pointer-events: none;
  }
  .bag-btn img,
  .dice-btn img,
  .img-btn img {
    pointer-events: auto;
  }

  button, input, select, textarea { font-family: inherit; }

  html, body { min-height: 100%; }
  body {
    font-family: "MyFont", "Microsoft YaHei", sans-serif;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px;
    background: #1a1a2e url('img/beijing.jpg') center / cover no-repeat;
    background-attachment: fixed;
  }

  /* ============ 下雪画布 ============ */
  #snowCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  .title-wrap, .board-tabs, .board-wrap, .controls {
    position: relative;
    z-index: 2;
  }

  /* ============ 标题图 ============ */
  .title-wrap {
    display: inline-block;
    margin: 8px 0;
    max-width: min(80vw, 500px);
  }
  .title-img {
    display: block;
    max-width: 100%;
    height: auto;
    filter: drop-shadow(0 3px 8px rgba(0,0,0,0.7));
  }

  /* ============ 棋盘切换按钮 ============ */
  .board-tabs {
    display: flex; gap: 8px; margin-bottom: 10px;
    flex-wrap: wrap; justify-content: center;
  }
  .board-tabs button {
    padding: 8px 16px; border: none; border-radius: 6px;
    background: rgba(0,0,0,0.55); color: #fff; font-size: 16px; cursor: pointer;
  }
  .board-tabs button.active {
    background: #570b0b; color: #fff; font-weight: bold;
  }

  /* ============ 棋盘容器（横版 A4）============ */
  .board-wrap {
    position: relative;
    width: min(94vw, calc(82vh * 1.414), 1000px);
    aspect-ratio: 297 / 210;
    margin-bottom: 14px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.7);
  }
  .board-bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: fill;
    z-index: 1;
  }
  .board-grid {
    position: absolute; inset: 0;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 0; padding: 0;
    z-index: 2;
  }

  /* ============ 格子 ============ */
  .cell {
    border-radius: 4px;
    background: transparent;
    border: 1px dashed rgba(255,255,255,0.10);
  }

  /* ============ 棋子 ============ */
  .player-token {
    position: absolute;
    width: clamp(28px, 6%, 56px);
    height: auto;
    z-index: 10;
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: left 0.35s ease, top 0.35s ease;
    filter: drop-shadow(0 3px 8px rgba(0,0,0,0.8));
  }

  /* ============ 底部控制区 ============ */
  .controls {
    display: flex; gap: 14px; align-items: center;
    flex-wrap: wrap; justify-content: center; margin-bottom: 14px;
  }
  .dice-btn {
    padding: 0;
    border: none;
    background: transparent;
    cursor: pointer;
    touch-action: manipulation;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s;
  }
  .dice-btn-img {
    display: block;
    height: 85px;      /* 高度固定 */
    width: auto;       /* 宽度按比例自适应 */
    max-width: 180px;  /* 限制最宽，防止横图太长 */
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
  }
  .dice-btn:hover .dice-btn-img { transform: scale(1.04); }
  .dice-btn:active .dice-btn-img { transform: scale(0.96); }
  .dice-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .dice-img {
    width: 64px; height: 64px; object-fit: contain;
    background: rgba(0,0,0,0.35); border-radius: 8px;
  }
  .bag-btn {
    background: transparent; border: none; padding: 0;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .bag-icon {
    width: 60px; height: 60px; object-fit: contain;
    display: block;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.7));
    transition: transform 0.15s;
  }
  .bag-btn:active .bag-icon { transform: scale(0.92); }

  /* ============ 通用弹窗 ============ */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    display: none; align-items: center; justify-content: center; z-index: 100;
    padding: 20px;
  }
  .modal-mask.show { display: flex; }
  .modal-box {
    background: #2a2a40; border-radius: 16px; padding: 20px;
    max-width: 360px; width: 100%; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    position: relative;
  }

  /* ============ 卡片弹窗 ============ */
  .card-modal-box {
    background: transparent;
    padding: 0;
    max-width: none;
    width: min(92vw, 420px);
    position: relative;
    box-shadow: none;
  }
  .card-bg-img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  }
  .card-content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20% 12% 15% 12%;
    text-align: center;
  }
  .card-content h2 {
    font-size: 24px;
    color: #fff;
    margin-bottom: 10px;
  }
  .card-content p {
    font-size: 17px;
    color: #fff;
    line-height: 1.6;
    margin-bottom: 14px;
  }

  /* ============ 背包 / 制作 弹窗 ============ */
  .bag-modal-box {
    background: transparent; padding: 0;
    max-width: none; width: min(92vw, 520px);
    position: relative; box-shadow: none;
  }
  .bag-bg-img {
    display: block; width: 100%; height: auto;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  }
  .bag-content {
    position: absolute; inset: 0;
    padding: 18% 12% 14% 12%;
    display: flex; flex-direction: column; align-items: center;
    overflow-y: auto;
  }
  .bag-content h2 {
    font-size: 18px; margin-bottom: 8px; color: #333;
    text-shadow: 0 1px 2px rgba(255,255,255,0.5);
  }
  .bag-list { width: 100%; flex: 1; overflow-y: auto; padding: 4px; }
  .bag-item {
    padding: 6px 10px; background: rgba(255,255,255,0.75);
    border-radius: 6px; margin-bottom: 4px;
    font-size: 15px; color: #222; text-align: left;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .bag-item:hover { background: rgba(255,255,255,0.98); }
  .bag-item:active { transform: scale(0.98); }
  .bag-empty { color: #666; font-size: 15px; text-align: center; margin-top: 20px; }

  /* ============ 饥饿 / 口渴 状态条 ============ */
  .status-bars {
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 140px;
    flex-shrink: 0;
  }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
  }
  .bar-icon {
    width: 36px;
    height: 36px;
    object-fit: contain;
    display: block;
    flex-shrink: 0;
  }
  .bar-track {
    flex: 1;
    height: 10px;
    background: rgba(0,0,0,0.55);
    border-radius: 5px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .bar-fill {
    height: 100%;
    width: 100%;
    transition: width 0.4s ease;
  }
  .bar-fill.hunger { background: linear-gradient(90deg, #8b4141, #a59e98); }
  .bar-fill.thirst { background: linear-gradient(90deg, #4a6581, #a2acb4); }
  .bar-num {
    min-width: 26px;
    text-align: right;
    color: #eee;
    font-size: 12px;
    text-shadow: 0 1px 3px #000;
  }

  /* ============ 眨眼遮罩 ============ */
  .blink-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 9998;
  }
  .blink-overlay.blink {
    animation: blinkAnim 4.5s ease-in-out forwards;
  }
  @keyframes blinkAnim {
    0%   { opacity: 0; }
    45%  { opacity: 1; }    /* 缓慢闭眼 */
    60%  { opacity: 0; }    /* 缓慢睁开 */
    80%  { opacity: 1; }    /* 再次缓慢闭眼 */
    100% { opacity: 1; }    /* 保持全黑 */
  }

  /* ============ 暗角 ============ */
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    opacity: 0;
    transition: opacity 0.6s ease;
    background: radial-gradient(
      circle at center,
      transparent 0%,
      transparent 20%,
      rgba(0,0,0,0.5) 55%,
      rgba(0,0,0,0.95) 100%
    );
  }

  /* ============ 死亡遮罩 ============ */
  .death-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    z-index: 9999;
  }
  .death-overlay.show { display: flex; }
  .death-text {
    color: #c31414;
    font-size: 32px;
    letter-spacing: 6px;
    font-weight: bold;
    text-align: center;
    padding: 0 20px;
    text-shadow: 0 0 20px #ff0000, 0 0 40px #8b0000;
    animation: deathFadeIn 3s ease forwards;
    opacity: 0;
  }
  @keyframes deathFadeIn {
    from { opacity: 0; transform: scale(1.1); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* ============ 重开按钮 ============ */
  .restart-btn {
    color: #c31414;
    font-size: 16px;
    letter-spacing: 4px;
    font-weight: bold;
    padding: 8px 20px;
    background: transparent;
    border: none;
    cursor: pointer;
    text-shadow: 0 0 10px #ff0000, 0 0 20px #8b0000;
    font-family: inherit;
    opacity: 0;
    animation: restartFadeIn 2s ease 3s forwards;
  }
  .restart-btn:hover {
    color: #ff3333;
    text-shadow: 0 0 15px #ff0000, 0 0 30px #ff0000, 0 0 45px #8b0000;
    transform: scale(1.05);
  }
  @keyframes restartFadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ============ 重开时的白色发光字 ============ */
  .revive-text {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 28px;
    letter-spacing: 5px;
    text-align: center;
    text-shadow:
      0 0 10px #fff,
      0 0 20px #fff,
      0 0 40px #aaddff,
      0 0 60px #aaddff;
    opacity: 0;
    pointer-events: none;
    z-index: 10000;
    padding: 0 20px;
    width: 100%;
    max-width: 90vw;
  }
  .revive-text.show { animation: reviveFade 4s ease forwards; }
  @keyframes reviveFade {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
    15%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    75%  { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ============ 物品介绍弹窗 ============ */
  .item-modal-box {
    background: transparent;
    border-radius: 0;
    padding: 16px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    box-shadow: none;
  }
  .item-modal-box .item-img {
    display: block;
    width: 100px;
    height: 100px;
    object-fit: contain;
    margin: 0 auto 12px auto;
    border-radius: 10px;
    filter: drop-shadow(0 6px 20px rgba(0,0,0,0.8));
  }
  .item-modal-box h2 {
    font-size: 22px;
    color: #fff;
    text-align: center;
    margin-bottom: 12px;
    text-shadow: 0 2px 6px #000, 0 0 12px rgba(0,0,0,0.9);
  }
  .item-actions {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    align-items: center;
  }

  /* ============ 图片按钮通用样式 ============ */
  .img-btn {
    background: transparent !important;
    border: none !important;
    padding: 0 !important;
    box-shadow: none !important;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s;
    font-family: inherit;
  }
  .img-btn img {
    display: block;
    width: 55px;
    height: auto;
    filter: drop-shadow(0 3px 8px rgba(0,0,0,0.7));
  }
  .img-btn:hover img { transform: scale(1.06); }
  .img-btn:active img { transform: scale(0.94); }

  .item-actions .use-btn { display: none; }
  .item-actions .eat-btn { display: none; }

  /* ============ 制作（配方列表）============ */
  .recipe-list {
    width: 100%;
    flex: 1;
    overflow-y: auto;
    padding: 4px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    align-content: start;
  }
  .recipe-item {
    background: rgba(255,255,255,0.78);
    border-radius: 8px;
    padding: 6px;
    text-align: center;
    color: #222;
    font-size: 11px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    aspect-ratio: 1 / 1;
    overflow: hidden;
  }
  .recipe-item .recipe-title {
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 3px;
    color: #111;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .recipe-item .recipe-mat {
    font-size: 10px;
    margin: 1px 0;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .recipe-item .recipe-mat.ok      { color: #2e7d32; }
  .recipe-item .recipe-mat.missing { color: #c62828; }
  .recipe-item .recipe-action {
    margin-top: 4px;
    padding: 4px 6px;
    border: none;
    border-radius: 5px;
    background: #2e7d32;
    color: #fff;
    cursor: pointer;
    font-size: 11px;
    font-family: inherit;
    transition: background 0.15s, transform 0.1s;
    width: 100%;
  }
  .recipe-item .recipe-action:hover { background: #43a047; }
  .recipe-item .recipe-action:active { transform: scale(0.96); }
  .recipe-item .recipe-action:disabled {
    background: #888;
    cursor: not-allowed;
    opacity: 0.7;
  }
  .recipe-empty {
    color: #555;
    font-size: 14px;
    text-align: center;
    margin-top: 20px;
    grid-column: 1 / -1;
  }

  /* ============ 剧情播放器 ============ */
  .story-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 60px 40px;
    z-index: 500;
    cursor: pointer;
    user-select: none;
    overflow-y: auto;
  }
  .story-overlay.show { display: flex; }

  .story-text {
    color: #fff;
    font-size: 20px;
    line-height: 2;
    letter-spacing: 1px;
    max-width: 640px;
    width: 100%;
    text-align: center;
    white-space: pre-wrap;
    word-break: break-word;
    margin: auto 0;
    text-shadow:
      0 0 6px #fff,
      0 0 12px rgba(200, 220, 255, 0.85),
      0 0 24px rgba(150, 180, 255, 0.6);
  }

  .story-choices {
    display: none;
    flex-direction: column;
    gap: 14px;
    margin-top: 36px;
    width: 100%;
    max-width: 400px;
  }
  .story-choices.show { display: flex; }

  .story-choice {
    padding: 10px 20px;
    background: transparent;
    border: none;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    text-align: center;
    text-shadow:
      0 0 6px #fff,
      0 0 12px rgba(200, 220, 255, 0.85),
      0 0 24px rgba(150, 180, 255, 0.6);
  }
  .story-choice:hover {
    color: #fff;
    text-shadow:
      0 0 8px #fff,
      0 0 16px #fff,
      0 0 32px rgba(200, 220, 255, 1),
      0 0 48px rgba(150, 180, 255, 0.8);
    transform: scale(1.05);
  }

  .story-blink {
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
  }
  .story-blink.active {
    animation: storyBlinkAnim 1.2s ease-in-out;
  }
  @keyframes storyBlinkAnim {
    0%   { opacity: 0; }
    45%  { opacity: 1; }
    55%  { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ============ 手机端紧凑布局 ============ */
  @media (max-width: 480px) {
    .status-bars { width: 110px; }
    .bar-row { font-size: 11px; gap: 3px; }
    .bar-icon { width: 24px; height: 24px; }
    .bar-num { font-size: 11px; min-width: 22px; }
    .death-text { font-size: 22px; letter-spacing: 4px; }
    .story-overlay { padding: 40px 20px; }
    .story-text { font-size: 16px; line-height: 1.9; }
    .story-choice { font-size: 17px; padding: 8px 12px; }    

    /* 制作格子：手机上取消正方形，改成高度自适应 */
    .recipe-list { grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .recipe-item {
      aspect-ratio: auto;      /* ← 取消正方形 */
      min-height: 90px;        /* ← 保证最小高度 */
      padding: 5px;
    }
    .recipe-item .recipe-title { font-size: 11px; }
    .recipe-item .recipe-mat   { font-size: 9px; }
    .recipe-item .recipe-action { font-size: 10px; padding: 3px 4px; }
  }
</style>
</head>
<body>

<!-- 标题图 -->
<div class="title-wrap">
  <img class="title-img" src="img/biaoti.png" alt="标题"
       onerror="this.outerHTML='<h1 style=&quot;font-size:22px;margin:8px 0;text-shadow:0 2px 6px #000;&quot;>Beneath the Ice</h1>'">
</div>

<div class="board-tabs" id="boardTabs"></div>

<div class="board-wrap" id="boardWrap">
  <img class="board-bg" id="boardBg" src="" alt="">
  <div class="board-grid" id="boardGrid"></div>
  <img class="player-token" id="playerToken" src="img/piece.png" alt="棋子">
</div>

<div class="controls">
  <div class="status-bars">
    <div class="bar-row">
      <img class="bar-icon" src="img/hunger.png" alt="饥饿">
      <div class="bar-track"><div class="bar-fill hunger" id="hungerBar"></div></div>
      <span class="bar-num" id="hungerNum">100</span>
    </div>
    <div class="bar-row">
      <img class="bar-icon" src="img/thirst.png" alt="口渴">
      <div class="bar-track"><div class="bar-fill thirst" id="thirstBar"></div></div>
      <span class="bar-num" id="thirstNum">100</span>
    </div>
  </div>
  <button class="dice-btn" id="rollBtn" title="投掷">
    <img class="dice-btn-img" src="img/roll.png" alt="投掷">
  </button>
  <img class="dice-img" id="diceImg" src="" alt="?" onerror="this.style.display='none'">
  <button class="bag-btn" id="bagBtn" title="背包">
    <img class="bag-icon" src="img/pack1.png" alt="背包">
  </button>
  <button class="bag-btn" id="workbenchBtn" title="制作">
    <img class="bag-icon" src="img/craft.png" alt="制作"
         onerror="this.outerHTML='<span style=&quot;color:#fff;font-size:14px;padding:8px;&quot;>制作</span>'">
  </button>
</div>

<!-- 下雪效果画布 -->
<canvas id="snowCanvas"></canvas>

<!-- 卡片弹窗 -->
<div class="modal-mask" id="cardModal">
  <div class="modal-box card-modal-box">
    <img class="card-bg-img" id="cardImg" src="" alt="" onerror="this.style.display='none'">
    <div class="card-content">
      <h2 id="cardTitle"></h2>
      <p id="cardDesc"></p>
      <button class="img-btn" onclick="closeModal('cardModal')">
        <img src="img/close.png" alt="关闭">
      </button>
    </div>
  </div>
</div>

<!-- 背包弹窗 -->
<div class="modal-mask" id="bagModal">
  <div class="modal-box bag-modal-box">
    <img class="bag-bg-img" src="img/pack2.png" alt="背包"
         onerror="this.style.display='none'; this.parentNode.style.background='#2a2a40'; this.parentNode.style.padding='20px';">
    <div class="bag-content">
      <h2>我的背包</h2>
      <div class="bag-list" id="bagList"></div>
      <button class="img-btn" onclick="closeModal('bagModal')">
        <img src="img/close.png" alt="关闭">
      </button>
    </div>
  </div>
</div>

<!-- 物品介绍弹窗 -->

<script>
/* ============================================================
   防保存：禁止右键 + 禁止拖拽图片
   ============================================================ */
document.addEventListener('contextmenu', e => {
  if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
    e.preventDefault();
  }
});
document.addEventListener('dragstart', e => {
  if (e.target.tagName === 'IMG') e.preventDefault();
});

/* ============================================================
   常量
   ============================================================ */
const SAVE_KEY = 'boardGameSave_v1';
const TOTAL_CELLS = 25;
const WEATHER_CHANGE_INTERVAL = 10;   // 每投 10 次骰子换一次天气

/* ============================================================
   图片路径配置
   ============================================================ */

/* ============================================================
   每个棋盘独立的随机池
   ============================================================ */
const REWARD_POOLS = [
  ['净水片', '暖宝宝', '打火机', '压缩饼干', '瓶装水', '盒饭', '电工胶带', '废弃铁料', '污水'],
  ['罐头', '能量棒', '压缩饼干', '抗生素', '巧克力', '废弃木料', '肉', '蔫了的蔬菜'],
  ['绷带', '酒精', '罐头', '瓶装水', '急救包']
];

const EVENT_POOLS = [
  ['水塔维修日志', '损坏的卫星电话'],
  ['某户人家的日记', '家庭合照', '木雕', '拍立得', '雪地摩托钥匙'],
  ['圣经', '儿童画', '遗留的路线图']
];

/* ============================================================
   食物 / 饮水效果表
   ============================================================ */
const FOOD_EFFECTS = {
  '压缩饼干': { hunger: 30 },
  '盒饭':     { hunger: 45 },
  '罐头':     { hunger: 35 },
  '能量棒':   { hunger: 25 },
  '巧克力':   { hunger: 20 },
  '青菜炒肉': { hunger: 45 },
  '自热火锅': { hunger: 45 },
  '瓶装水':   { thirst: 40 },
  '急救包':   { hunger: 25, thirst: 25 },
  '抗生素':   { hunger: 10, thirst: 10 },
};

/* ============================================================
   制作配方表
   ============================================================ */
const RECIPES = {
  '瓶装水':   { materials: { '净水片': 1, '污水': 1 } },
  '卫星电话': { materials: { '损坏的卫星电话': 1, '废弃铁料': 2, '电工胶带': 1} },
  '急救包':   { materials: { '绷带': 1, '酒精': 1 } },
  '青菜炒肉': { materials: { '肉': 1, '蔫了的蔬菜': 2, '打火机': 1 } },
  '自热火锅': { materials: { '肉': 1, '蔫了的蔬菜': 2, '暖宝宝': 1 } },

};

/* ============================================================
   棋盘数据：3 个棋盘，每个 25 格
   ============================================================ */
const BOARDS = [
  {
    name: '水塔',
    cells: [
      { color: 'white',  effect: { type: 'none' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'yellow', effect: { type: 'item' } },

      { color: 'yellow', effect: { type: 'none' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'white',  effect: { type: 'none' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'purple', effect: { type: 'item' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'white',  effect: { type: 'none' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'red',    effect: { type: 'step', value: -3 } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'red',    effect: { type: 'step', value: -1 } },
      { color: 'white',  effect: { type: 'none' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'red',    effect: { type: 'step', value: -2 } },
      { color: 'white',  effect: { type: 'none' } },
      { color: 'purple', effect: { type: 'item' } },
      { color: 'white',  effect: { type: 'none' } }
    ]
  },
  {
    name: '公寓',
    cells: [
      { color: 'white',  effect: { type: 'none' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'red',    effect: { type: 'step', value: -1 } },
      { color: 'white',  effect: { type: 'none' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'purple', effect: { type: 'item' } },
      { color: 'red',    effect: { type: 'step', value: -2 } },
      { color: 'white',  effect: { type: 'none' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'red',    effect: { type: 'step', value: -1 } },
      { color: 'white',  effect: { type: 'none' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'purple', effect: { type: 'item' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'white',  effect: { type: 'none' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'red',    effect: { type: 'step', value: -3 } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'white',  effect: { type: 'none' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'white',  effect: { type: 'none' } }
    ]
  },
  {
    name: '教堂',
    cells: [
      { color: 'white',  effect: { type: 'none' } },
      { color: 'red',    effect: { type: 'step', value: -1 } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'white',  effect: { type: 'none' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'purple', effect: { type: 'item' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'white',  effect: { type: 'none' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'red',    effect: { type: 'step', value: -2 } },
      { color: 'white',  effect: { type: 'none' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'white',  effect: { type: 'none' } },
      { color: 'red',    effect: { type: 'step', value: -1 } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'purple', effect: { type: 'item' } },
      { color: 'white',  effect: { type: 'none' } },
      { color: 'yellow', effect: { type: 'item' } },
      { color: 'white',  effect: { type: 'none' } }
    ]
  }
];

/* ============================================================
   游戏状态 + 存档
   ============================================================ */
let currentBoardIndex = 0;
let playerPos = 0;
let inventory = {};
let nextStepModifier = 0;
let isMoving = false;
let hunger = 100;
let thirst = 100;
let isDead = false;
let currentItemName = '';
let collectedEvents = [[], [], []];

// 天气：'sunny' | 'light-snow' | 'blizzard'
let weather = 'sunny';
let rollCount = 0;

function saveGame() {
  const data = {
    boardIndex: currentBoardIndex,
    pos: playerPos,
    bag: inventory,
    stepMod: nextStepModifier,
    hunger: hunger,
    thirst: thirst,
    isDead: isDead,
    collectedEvents: collectedEvents,
    weather: weather,
    rollCount: rollCount,
    storyProgress: storyProgress
  };
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch (e) {
    console.warn('存档失败：', e);
  }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    currentBoardIndex = data.boardIndex || 0;
    playerPos = data.pos || 0;
    inventory = data.bag || {};
    nextStepModifier = data.stepMod || 0;
    hunger = (typeof data.hunger === 'number') ? data.hunger : 100;
    thirst = (typeof data.thirst === 'number') ? data.thirst : 100;
    isDead = !!data.isDead;
    collectedEvents = data.collectedEvents || [[], [], []];
    weather = data.weather || 'sunny';
    rollCount = (typeof data.rollCount === 'number') ? data.rollCount : 0;
    storyProgress = data.storyProgress || {};
    return true;
  } catch (e) {
    console.warn('读档失败：', e);
    return false;
  }
}

/* ============================================================
   DOM 引用
   ============================================================ */
const boardTabs = document.getElementById('boardTabs');
const boardGrid = document.getElementById('boardGrid');
const boardBg = document.getElementById('boardBg');
const playerToken = document.getElementById('playerToken');
const rollBtn = document.getElementById('rollBtn');
const diceImg = document.getElementById('diceImg');
const bagBtn = document.getElementById('bagBtn');
const workbenchBtn = document.getElementById('workbenchBtn');

BOARDS.forEach((b, i) => {
  const btn = document.createElement('button');
  btn.textContent = b.name;
  btn.onclick = () => switchBoard(i);
  boardTabs.appendChild(btn);
});

function switchBoard(index) {
  if (isMoving) return;
  currentBoardIndex = index;
  playerPos = 0;
  nextStepModifier = 0;
  [...boardTabs.children].forEach((b, i) => b.classList.toggle('active', i === index));
  renderBoard();
  updatePlayerToken();
  saveGame();
}

/* ============================================================
   25 格蛇形路径
   ============================================================ */
const CELL_ORDER = [
  [1,1],[1,2],[1,3],[1,4],[1,5],
  [2,5],[2,4],[2,3],[2,2],[2,1],
  [3,1],[3,2],[3,3],[3,4],[3,5],
  [4,5],[4,4],[4,3],[4,2],[4,1],
  [5,1],[5,2],[5,3],[5,4],[5,5]
];

function renderBoard() {
  const board = BOARDS[currentBoardIndex];
  boardBg.src = IMG.boards[currentBoardIndex] || '';
  boardGrid.innerHTML = '';

  const cellMap = {};
  CELL_ORDER.forEach((pos, idx) => { cellMap[pos[0] + ',' + pos[1]] = idx; });

  for (let r = 1; r <= 5; r++) {
    for (let c = 1; c <= 5; c++) {
      const div = document.createElement('div');
      div.className = 'cell';
      const key = r + ',' + c;
      if (cellMap[key] !== undefined) {
        const idx = cellMap[key];
        const cellData = board.cells[idx];
        div.classList.add(cellData.color);
        if (idx === 0) div.classList.add('start');
        if (idx === 24) div.classList.add('end');
      }
      boardGrid.appendChild(div);
    }
  }
}

function updatePlayerToken() {
  const pos = CELL_ORDER[playerPos];
  const row = pos[0], col = pos[1];
  playerToken.style.left = ((col - 1) * 20 + 10) + '%';
  playerToken.style.top  = ((row - 1) * 20 + 10) + '%';
}

/* ============================================================
   天气系统
   ============================================================ */
function applyWeather(newWeather) {
  weather = newWeather;
  document.body.classList.remove('weather-sunny', 'weather-light-snow', 'weather-blizzard');
  document.body.classList.add('weather-' + newWeather);
}

function randomizeWeather() {
  const pool = ['sunny', 'light-snow', 'blizzard'];
  const newWeather = pool[Math.floor(Math.random() * pool.length)];
  applyWeather(newWeather);
}

/* ============================================================
   投骰子
   ============================================================ */
rollBtn.onclick = () => {
  if (isMoving || isDead) return;
  isMoving = true;
  rollBtn.disabled = true;

  const dice = Math.floor(Math.random() * 6) + 1;
  diceImg.src = IMG.dice[dice] || '';
  diceImg.style.display = 'block';

  let steps = dice + nextStepModifier;
  nextStepModifier = 0;

  // 暴雪：步数 -1
  if (weather === 'blizzard') steps -= 1;
  if (steps < 1) steps = 1;

  let moved = 0;
  const timer = setInterval(() => {
    if (moved < steps) {
      moved++;
      playerPos = (playerPos + 1) % TOTAL_CELLS;
      updatePlayerToken();
    } else {
      clearInterval(timer);
      isMoving = false;
      rollBtn.disabled = false;
      triggerCellEffect(playerPos);
      decreaseStats();

      // 投掷计数：每 10 次换一次天气
      rollCount++;
      if (rollCount >= WEATHER_CHANGE_INTERVAL) {
        rollCount = 0;
        randomizeWeather();
      }

      saveGame();
    }
  }, 280);
};

/* ============================================================
   格子效果
   ============================================================ */
function triggerCellEffect(pos) {
  const board = BOARDS[currentBoardIndex];
  const cell = board.cells[pos];
  if (!cell || cell.effect.type === 'none') return;

  const effect = cell.effect;

  if (effect.type === 'item') {
    let name;

    if (cell.color === 'yellow') {
      const pool = REWARD_POOLS[currentBoardIndex];
      name = pool[Math.floor(Math.random() * pool.length)];

    } else if (cell.color === 'purple') {
      const fullPool = EVENT_POOLS[currentBoardIndex] || [];
      const collected = collectedEvents[currentBoardIndex] || [];
      const remaining = fullPool.filter(item => !collected.includes(item));

      if (remaining.length === 0) {
        showCard(cell.color, '似曾相识', '这里的东西你已经带走了……');
        return;
      }

      name = remaining[Math.floor(Math.random() * remaining.length)];
      collected.push(name);
    }

    if (!name) name = '神秘道具';

    inventory[name] = (inventory[name] || 0) + 1;
    showCard(cell.color, '获得道具', `你获得了【${name}】！`);

  } else if (effect.type === 'step') {
    const val = (typeof effect.value === 'number') ? effect.value : 0;
    if (val === 0) return;
    nextStepModifier += val;
    const word = val < 0 ? '减少' : '增加';
    showCard(cell.color, '遭遇危险', `下一次投骰子后，步数${word} ${Math.abs(val)} 步。`);
  }
}

/* ============================================================
   卡片弹窗
   ============================================================ */
function showCard(color, title, desc) {
  document.getElementById('cardTitle').textContent = title;
  document.getElementById('cardDesc').textContent = desc;
  const img = document.getElementById('cardImg');
  img.src = IMG.cards[color] || '';
  img.style.display = 'block';
  document.getElementById('cardModal').classList.add('show');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

/* ============================================================
   饥饿 / 口渴系统
   ============================================================ */
function decreaseStats() {
  if (isDead) return;

  // 天气额外扣除：小雪 / 暴雪 额外 -1
  const extra = (weather === 'light-snow' || weather === 'blizzard') ? 1 : 0;

  hunger = Math.max(0, hunger - (Math.floor(Math.random() * 4) + 2 + extra));
  thirst = Math.max(0, thirst - (Math.floor(Math.random() * 4) + 2 + extra));
  updateStatusBars();
  checkDeath();
}

function updateStatusBars() {
  const hungerBar = document.getElementById('hungerBar');
  const thirstBar = document.getElementById('thirstBar');
  const hungerNum = document.getElementById('hungerNum');
  const thirstNum = document.getElementById('thirstNum');

  hungerBar.style.width = hunger + '%';
  thirstBar.style.width = thirst + '%';
  hungerNum.textContent = Math.ceil(hunger);
  thirstNum.textContent = Math.ceil(thirst);

  const minV = Math.min(hunger, thirst);
  const vignette = document.getElementById('vignette');

  if (minV <= 0) {
    vignette.style.opacity = 0;
  } else if (minV >= 50) {
    vignette.style.opacity = 0;
  } else if (minV >= 10) {
    const t = (50 - minV) / 40;
    vignette.style.opacity = (t * 0.95).toFixed(3);
  } else {
    const t = (10 - minV) / 10;
    vignette.style.opacity = (0.95 + t * 0.05).toFixed(3);
  }
}

function checkDeath() {
  // 如果已经是死亡状态：确保界面处于死亡状态
  if (isDead) {
    rollBtn.disabled = true;
    document.getElementById('vignette').style.opacity = 0;
    document.getElementById('blinkOverlay').style.opacity = 1;
    document.getElementById('deathOverlay').classList.add('show');
    return;
  }

  // 刚触发死亡
  if (Math.ceil(hunger) <= 0 || Math.ceil(thirst) <= 0) {
    isDead = true;
    rollBtn.disabled = true;
    document.getElementById('vignette').style.opacity = 0;

    // 播眨眼动画
    const blink = document.getElementById('blinkOverlay');
    blink.classList.remove('blink');
    void blink.offsetWidth;      // 强制重排，让动画能重播
    blink.classList.add('blink');

    // 眨眼结束后显示死亡遮罩
    setTimeout(() => {
      const overlay = document.getElementById('deathOverlay');
      overlay.classList.remove('show');
      void overlay.offsetWidth;
      overlay.classList.add('show');
      saveGame();
    }, 4500);   // 和动画时长 0.8s 保持一致
  }
}

/* ============================================================
   背包
   ============================================================ */
bagBtn.onclick = () => {
  refreshBagList();
  document.getElementById('bagModal').classList.add('show');
};

function refreshBagList() {
  const list = document.getElementById('bagList');
  const entries = Object.entries(inventory);

  if (entries.length === 0) {
    list.innerHTML = '<div class="bag-empty">背包空空如也……</div>';
  } else {
    list.innerHTML = entries.map(([name, count], i) =>
      `<div class="bag-item" data-name="${name}">${i + 1}. ${name} × ${count}</div>`
    ).join('');
    list.querySelectorAll('.bag-item').forEach(el => {
      el.onclick = () => showItem(el.dataset.name);
    });
  }
}

function showItem(name) {
  currentItemName = name;
  document.getElementById('itemName').textContent = name;

  const img = document.getElementById('itemImg');
  const fallback = document.getElementById('itemFallback');

  img.style.display = 'block';
  fallback.style.display = 'none';
  img.src = 'img/items/' + encodeURIComponent(name) + '.png';

  // 食物/水 → 显示「食用」
  document.getElementById('eatItemBtn').style.display =
    FOOD_EFFECTS[name] ? 'flex' : 'none';

  // 剧情道具 → 显示「使用」
  document.getElementById('useItemBtn').style.display =
    STORY_ITEMS[name] ? 'flex' : 'none';

  document.getElementById('itemModal').classList.add('show');
}

/* 使用剧情道具 */
function useStoryItem() {
  if (isDead) return;
  const name = currentItemName;
  if (!STORY_ITEMS[name]) return;

  closeModal('itemModal');
  closeModal('bagModal');
  triggerStory(name);
}

function useCurrentItem() {
  if (isDead) return;

  const name = currentItemName;
  const effect = FOOD_EFFECTS[name];
  if (!effect) return;
  if (!inventory[name] || inventory[name] <= 0) return;

  if (effect.hunger) hunger = Math.min(100, hunger + effect.hunger);
  if (effect.thirst) thirst = Math.min(100, thirst + effect.thirst);

  inventory[name]--;
  if (inventory[name] <= 0) delete inventory[name];

  updateStatusBars();
  saveGame();

  closeModal('itemModal');
  refreshBagList();
}

/* ============================================================
   制作
   ============================================================ */
function canCraft(name) {
  const recipe = RECIPES[name];
  if (!recipe) return false;
  for (const [mat, need] of Object.entries(recipe.materials)) {
    if ((inventory[mat] || 0) < need) return false;
  }
  return true;
}

workbenchBtn.onclick = () => {
  renderRecipeList();
  document.getElementById('workbenchModal').classList.add('show');
};

function renderRecipeList() {
  const list = document.getElementById('recipeList');
  const names = Object.keys(RECIPES);

  if (names.length === 0) {
    list.innerHTML = '<div class="recipe-empty">暂无可用配方……</div>';
    return;
  }

  list.innerHTML = names.map(name => {
    const recipe = RECIPES[name];

    const matLines = Object.entries(recipe.materials).map(([mat, need]) => {
      const have = inventory[mat] || 0;
      const ok = have >= need;
      const icon = ok ? '✓' : '✗';
      return `<div class="recipe-mat ${ok ? 'ok' : 'missing'}">${icon} ${mat} × ${need}（拥有 ${have}）</div>`;
    }).join('');

    const can = canCraft(name);
    const btnText = can ? '合成' : '材料不足';
    const disabled = can ? '' : 'disabled';

    return `
      <div class="recipe-item">
        <div class="recipe-title">${name} × 1</div>
        ${matLines}
        <button class="recipe-action" ${disabled}
                onclick="craftFromWorkbench('${name}')">${btnText}</button>
      </div>
    `;
  }).join('');
}

function craftFromWorkbench(name) {
  if (isDead) return;
  if (!canCraft(name)) return;

  const recipe = RECIPES[name];

  for (const [mat, need] of Object.entries(recipe.materials)) {
    inventory[mat] -= need;
    if (inventory[mat] <= 0) delete inventory[mat];
  }

  inventory[name] = (inventory[name] || 0) + 1;

  saveGame();
  renderRecipeList();

  const mats = Object.entries(recipe.materials)
    .map(([m, n]) => `${m} × ${n}`).join(' + ');
  showCard('yellow', '制作成功', `${mats} → 【${name}】`);
}

/* ============================================================
   重新开始
   ============================================================ */
function restartGame() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    // 重置眨眼遮罩
  const blink = document.getElementById('blinkOverlay');
  blink.classList.remove('blink');
  blink.style.opacity = 0;

  currentBoardIndex = 0;
  playerPos = 0;
  inventory = {};
  nextStepModifier = 0;
  isMoving = false;
  hunger = 100;
  thirst = 100;
  isDead = false;
  collectedEvents = [[], [], []];
  weather = 'sunny';
  rollCount = 0;
  storyProgress = {};
  closeStory();

  document.getElementById('deathOverlay').classList.remove('show');
  rollBtn.disabled = false;

  applyWeather('sunny');
  updateStatusBars();
  switchBoard(0);

  const reviveText = document.getElementById('reviveText');
  reviveText.classList.remove('show');
  void reviveText.offsetWidth;
  reviveText.classList.add('show');
}

document.getElementById('restartBtn').onclick = restartGame;

/* ============================================================
   剧情系统
   ============================================================ */
const STORY_ITEMS = {
  '卫星电话': {
    intro: [
      `你是在水塔第三层找到它的,这里是控制室。
它被压在钻探队的工具底下，外壳结了一层薄冰。你把它抠出来的时候，手指冻得几乎没有知觉了。天线断了半截，你花了一些时间才把它修好。
嘟——嘟——嘟——
你蹲了下来，紧紧握着手里面的电话，听着那个声音穿透冰原。你不知道它会往哪里拨，也许是什么救援中心。电话终于被接通，你松了一口气。`,
      `「格陵兰港口关闭 重复 格陵兰港口关闭」
是自动广播，声音平稳，每隔几秒重复一次。背景里有细微的电流声，但你还听到了什么声音，很轻，像从某个教堂塔楼传过来的。
「不要靠近港口 重复 不要靠近港口 」
你张了张嘴，想说话，但广播不给你插话的空隙。它循环着，一遍，两遍，三遍。你开始意识到，这是给所有还能拨通这通电话的人听的。听着重复的播报，你心里感到有点烦闷。
水塔的储水罐外层已经有点结冰，你盯着它看，想起水龙头里流出来的水，透明，冰凉，看起来就是很普通的水。你突然有想尝尝它的冲动。`,
      `嘟——
电话断了,广播消失。控制室安静下来。
你蹲在原地，手机屏幕暗下去之前，你看见最后一行小字：
「当前可探索区域：水塔」
「下一区域解锁条件：完成本阶段打卡」`
    ],
    choices: [
      { label: '继续求救', resultText: '你又拨通一次，女声重复着之前的话。电话的声音惊动了不该来的东西……' },
      { label: '放弃求救', resultText: '你随手拿起锤子砸烂了电话，你不想再听到那个声音……' }
    ]
  }
};

let storyProgress = {};
const STORY_BLINK_MS = 1200;
const TYPING_SPEED = 55;

let storyQueue = [];
let storyIdx = 0;
let storyFullText = '';
let storyCharIdx = 0;
let storyTyping = false;
let storyTransitioning = false;
let storyAfterAll = null;
let storyCurrentName = null;
let storyTypingTimer = null;

// 累积已完成的文本
let storyAccumulated = '';
let storyPrefix = '';

const storyOverlay = document.getElementById('storyOverlay');
const storyTextEl = document.getElementById('storyText');
const storyChoicesEl = document.getElementById('storyChoices');
const storyBlinkEl = document.getElementById('storyBlink');

/* 拆句：按 。！？； 和换行；过滤掉单独的 "——" 或 "---" 行 */
function splitSentences(text) {
  const cleaned = text.replace(/^[—\-]{2,}\s*$/gm, '').replace(/\n{2,}/g, '\n');
  const regex = /[^。！？；\n]*[。！？；\n]+|[^。！？；\n]+/g;
  return (cleaned.match(regex) || [])
    .map(s => s.trim())
    .filter(s => s.length > 0);
}

/* 把段落数组展平成句子队列 */
function flattenToSentences(paragraphs) {
  const result = [];
  paragraphs.forEach(para => {
    const sentences = splitSentences(para);
    sentences.forEach((text, i) => {
      result.push({
        text,
        isParagraphStart: i === 0
      });
    });
  });
  return result;
}

/* 触发剧情 */
function triggerStory(name) {
  const data = STORY_ITEMS[name];
  if (!data) return;

  storyCurrentName = name;
  const progress = storyProgress[name] || 'unread';

  if (progress === 'continued') {
    storyQueue = flattenToSentences([data.choices[0].resultText]);
    storyAfterAll = () => {
      applyChoiceEffect(name, 0);
      closeStory();
    };
  } else if (progress === 'destroyed') {
    return;
  } else {
    storyQueue = flattenToSentences(data.intro);
    storyAfterAll = () => showStoryChoices(name);
  }

  storyIdx = 0;
  storyAccumulated = '';
  storyPrefix = '';
  storyTextEl.textContent = '';
  storyChoicesEl.innerHTML = '';
  storyChoicesEl.classList.remove('show');
  storyOverlay.classList.add('show');
  storyOverlay.scrollTop = 0;
  playNextSentence();
}

/* 播放下一句 */
function playNextSentence() {
  if (storyIdx >= storyQueue.length) {
    if (storyAfterAll) storyAfterAll();
    return;
  }

  const s = storyQueue[storyIdx];
  storyFullText = s.text;
  storyCharIdx = 0;
  storyTyping = true;

  // 段落开头 → 清空重来；同段内 → 保留累积，加换行
  if (s.isParagraphStart) {
    storyAccumulated = '';
    storyPrefix = '';
    storyTextEl.textContent = '';
  } else {
    storyPrefix = storyAccumulated ? storyAccumulated + '\n' : '';
  }

  storyTextEl.textContent = storyPrefix;
  clearTimeout(storyTypingTimer);
  typingStep();
}

/* 逐字打印 */
function typingStep() {
  if (!storyTyping) return;
  if (storyCharIdx >= storyFullText.length) {
    storyTyping = false;
    storyAccumulated = storyPrefix + storyFullText;
    return;
  }
  storyCharIdx++;
  storyTextEl.textContent = storyPrefix + storyFullText.slice(0, storyCharIdx);
  storyTypingTimer = setTimeout(typingStep, TYPING_SPEED);
}

/* 点击遮罩 */
function onStoryTap() {
  if (!storyOverlay.classList.contains('show')) return;
  if (storyTransitioning) return;
  if (storyChoicesEl.classList.contains('show')) return;

  if (storyTyping) {
    // 补全当前句
    storyTyping = false;
    clearTimeout(storyTypingTimer);
    storyTextEl.textContent = storyPrefix + storyFullText;
    storyAccumulated = storyPrefix + storyFullText;
    return;
  }

  advanceSentence();
}

/* 进入下一句 */
function advanceSentence() {
  if (storyIdx >= storyQueue.length - 1) {
    if (storyAfterAll) storyAfterAll();
    return;
  }

  const next = storyQueue[storyIdx + 1];
  const needBlink = next.isParagraphStart;

  if (needBlink) {
    storyTransitioning = true;
    storyBlinkEl.classList.remove('active');
    void storyBlinkEl.offsetWidth;
    storyBlinkEl.classList.add('active');

    setTimeout(() => {
      storyTransitioning = false;
      storyIdx++;
      playNextSentence();
    }, STORY_BLINK_MS);
  } else {
    storyIdx++;
    playNextSentence();
  }
}

/* 显示选项 */
function showStoryChoices(name) {
  const data = STORY_ITEMS[name];
  storyChoicesEl.innerHTML = data.choices.map((c, i) =>
    `<button class="story-choice" onclick="event.stopPropagation(); selectStoryChoice(${i})">${c.label}</button>`
  ).join('');
  storyChoicesEl.classList.add('show');
}

/* 选择选项 */
function selectStoryChoice(idx) {
  const name = storyCurrentName;
  const data = STORY_ITEMS[name];
  const choice = data.choices[idx];

  storyChoicesEl.classList.remove('show');
  storyChoicesEl.innerHTML = '';

  // 选中后清空、准备显示结果
  const showResult = () => {
    storyAccumulated = '';
    storyPrefix = '';
    storyTextEl.textContent = '';
    storyQueue = flattenToSentences([choice.resultText]);
    storyIdx = 0;
    storyAfterAll = () => {
      applyChoiceEffect(name, idx);
      closeStory();
    };
    playNextSentence();
  };

  // 「卫星电话」的「继续求救」不眨眼，直接显示
  const skipBlink = (name === '卫星电话' && idx === 0);

  if (skipBlink) {
    showResult();
    return;
  }

  // 其他选项保持眨眼过渡
  storyTransitioning = true;
  storyBlinkEl.classList.remove('active');
  void storyBlinkEl.offsetWidth;
  storyBlinkEl.classList.add('active');

  setTimeout(() => {
    storyTransitioning = false;
    showResult();
  }, STORY_BLINK_MS);
}

/* 应用选项效果 */
function applyChoiceEffect(name, idx) {
  if (name === '卫星电话') {
    if (idx === 0) {
      hunger = Math.max(0, hunger - 10);
      thirst = Math.max(0, thirst - 10);
      storyProgress['卫星电话'] = 'continued';
    } else if (idx === 1) {
      delete inventory['卫星电话'];
      inventory['废弃铁料'] = (inventory['废弃铁料'] || 0) + 5;
      storyProgress['卫星电话'] = 'destroyed';
    }
    saveGame();
    updateStatusBars();
    checkDeath();
  }
}

/* 关闭剧情 */
function closeStory() {
  storyOverlay.classList.remove('show');
  storyChoicesEl.classList.remove('show');
  storyChoicesEl.innerHTML = '';
  storyTextEl.textContent = '';
  storyCurrentName = null;
  storyQueue = [];
  storyIdx = 0;
  storyAccumulated = '';
  storyPrefix = '';
}

/* 绑定点击 */
storyOverlay.addEventListener('click', onStoryTap);

/* ============================================================
   启动
   ============================================================ */
(function startGame() {
  const hasSave = loadGame();
  if (hasSave) {
    [...boardTabs.children].forEach((b, i) =>
      b.classList.toggle('active', i === currentBoardIndex)
    );
    renderBoard();
    updatePlayerToken();
  } else {
    switchBoard(0);
  }
  applyWeather(weather);
  updateStatusBars();
  checkDeath();
})();

/* ============================================================
   下雪效果（密度 / 速度随天气变化）
   ============================================================ */
(function snowEffect() {
  const canvas = document.getElementById('snowCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  let W, H;
  const flakes = [];
  const BASE_COUNT = window.innerWidth < 600 ? 70 : 140;

  // 不同天气的倍率
  const SNOW_MULT = {
    'sunny':      1.0,   // 原样
    'light-snow': 1.7,   // 多一些
    'blizzard':   2.8    // 最多
  };
  const SPEED_MULT = {
    'sunny':      1.0,
    'light-snow': 1.25,
    'blizzard':   1.85
  };

  // 当前值（会平滑过渡）
  let currentMult = 1.0;
  let currentSpeed = 1.0;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function makeFlake(randomY) {
    return {
      x: Math.random() * W,
      y: randomY ? Math.random() * H : -10,
      r: Math.random() * 2.4 + 0.8,
      vy: Math.random() * 0.8 + 0.4,
      vx: (Math.random() - 0.5) * 0.5,
      swing: Math.random() * Math.PI * 2,
      swingSpeed: Math.random() * 0.02 + 0.01,
      alpha: Math.random() * 0.6 + 0.3
    };
  }

  for (let i = 0; i < BASE_COUNT; i++) flakes.push(makeFlake(true));

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // 目标倍率
    const targetMult  = SNOW_MULT[weather]  || 1.0;
    const targetSpeed = SPEED_MULT[weather] || 1.0;

    // 平滑逼近目标（每帧一小步，约 2 秒过渡完）
    currentMult  += (targetMult  - currentMult ) * 0.010;
    currentSpeed += (targetSpeed - currentSpeed) * 0.010;

    // 根据目标数量增减雪花
    const targetCount = Math.floor(BASE_COUNT * currentMult);
    while (flakes.length < targetCount) flakes.push(makeFlake(false));
    while (flakes.length > targetCount) flakes.pop();

    for (const f of flakes) {
      f.swing += f.swingSpeed;
      f.x += (f.vx + Math.sin(f.swing) * 0.7) * currentSpeed;
      f.y += f.vy * currentSpeed;

      if (f.y > H + 10) { f.y = -10; f.x = Math.random() * W; }
      if (f.x < -10) f.x = W + 10;
      if (f.x > W + 10) f.x = -10;

      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,' + f.alpha + ')';
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
